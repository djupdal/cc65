FEATURES {
    STARTADDRESS: default = $FD00;
}
SYMBOLS {
    __VLIR0_BLOCKS__:   type = export, value = ((__VLIR0_LAST__ - __VLIR0_START__ - __BSS_SIZE__) + 253) / 254;
}
MEMORY {
    CVT:    file   = %O,  start = $0,              size = $40000;
    ZP:     define = yes, start = $58,             size = $1A + $06;

    # INPUT_128 is the C128-specific input driver filetype: a separate
    # jump table (see libsrc/geos-cbm/inputdrv.inc) assembled at
    # MOUSE_BASE_128 ($FD00), not MOUSE_BASE ($FE80), with a tighter
    # budget up to END_MOUSE_128 ($FE80). Otherwise identical in kind to
    # geos-cbm-inputdrv.cfg: UpdateMouse runs at GEOS Kernal Interrupt
    # Level, which rules out cc65's usual C runtime (see
    # samples/geos/inputdrv-demo.s for why), so there is no stack/C-runtime
    # setup here either.
    VLIR0:  define = yes, start = %S,              size = $FE80 - %S;
}
SEGMENTS {
    ZEROPAGE:  type = zp,  load = ZP,                                   optional = yes;
    EXTZP:     type = zp,  load = ZP,                                   optional = yes;
    DIRENTRY:  type = ro,                 load = CVT, align      = $FE;
    FILEINFO:  type = ro,                 load = CVT, align      = $FE;
    RECORDS:   type = ro,                 load = CVT, align      = $FE, optional = yes;
    STARTUP:   type = ro,  run  = VLIR0,  load = CVT, align_load = $FE, define   = yes;
    CODE:      type = ro,  run  = VLIR0,  load = CVT,                   optional = yes;
    RODATA:    type = ro,  run  = VLIR0,  load = CVT,                   optional = yes;
    DATA:      type = rw,  run  = VLIR0,  load = CVT,                   optional = yes;
    BSS:       type = bss, load = VLIR0,                                define   = yes;
}
